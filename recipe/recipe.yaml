schema_version: 1

context:
  python_min: "3.10"
  version: "3.3.0.20261006"

package:
  name: types-geojson
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-geojson/types_geojson-${{ version }}.tar.gz
  sha256: cbb397341a9f3c6af716f0c93c4a0ccb08aebc41444bd1fbd86763e5cdfbe5fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - package_contents:
      site_packages:
        - geojson-stubs/__init__.pyi
  - python:
      imports: []
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Typing stubs for geojson
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - p-vdp
